<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3DDC84;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285F4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield background -->
  <path d="M64 8 L112 24 L112 64 Q112 96 64 120 Q16 96 16 64 L16 24 Z"
        fill="url(#grad)" stroke="#1A73E8" stroke-width="2"/>

  <!-- Valve/pipe symbol -->
  <circle cx="64" cy="64" r="32" fill="white" opacity="0.95"/>

  <!-- Pipe horizontal -->
  <rect x="32" y="56" width="64" height="16" fill="#3DDC84" rx="2"/>

  <!-- Valve wheel -->
  <circle cx="64" cy="64" r="12" fill="white" stroke="#3DDC84" stroke-width="3"/>
  <circle cx="64" cy="64" r="4" fill="#3DDC84"/>

  <!-- Valve spokes -->
  <line x1="64" y1="52" x2="64" y2="76" stroke="#3DDC84" stroke-width="2"/>
  <line x1="52" y1="64" x2="76" y2="64" stroke="#3DDC84" stroke-width="2"/>

  <!-- Flow arrows -->
  <path d="M 40 64 L 28 64 M 24 60 L 28 64 L 24 68" stroke="white" stroke-width="2" fill="none"/>
  <path d="M 88 64 L 100 64 M 96 60 L 100 64 L 96 68" stroke="white" stroke-width="2" fill="none"/>

  <!-- "N" text below -->
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="white">NetValve</text>
</svg>
